[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reeve"
version = "0.1.0"
description = "Reeve — chief-of-staff agent runtime for real-estate investors."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sse-starlette>=2.0",
  "motor>=3.4",
  "pymongo>=4.6",
  "boto3>=1.34",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "duckdb>=1.0",
  "pyjwt>=2.7",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "mongomock-motor>=0.0.30",
  "moto[dynamodb]>=5.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["reeve*"]
exclude = ["tests*", "infra*", "scripts*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
